{% extends "base.html" %}
{% block title %}{{ 'Edit' if mode == 'edit' else 'Add' }} Employee - EMS{% endblock %}
{% block heading %}{{ 'Edit Employee' if mode == 'edit' else 'Add New Employee' }}{% endblock %}
{% block content %}
<div class="card p-4">
  <form method="POST" novalidate>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Employee ID *</label>
        <input type="text" name="employee_id" class="form-control" value="{{ emp.get('employee_id', '') }}" placeholder="EMP008" required>
      </div>
      <div class="col-md-8">
        <label class="form-label">Full Name *</label>
        <input type="text" name="full_name" class="form-control" value="{{ emp.get('full_name', '') }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email Address *</label>
        <input type="email" name="email" class="form-control" value="{{ emp.get('email', '') }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone Number *</label>
        <input type="text" name="phone" class="form-control" value="{{ emp.get('phone', '') }}" placeholder="9876543210" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Department *</label>
        <select name="department" class="form-select" required>
          <option value="">Select department</option>
          {% for d in departments %}
            <option value="{{ d }}" {{ 'selected' if emp.get('department') == d }}>{{ d }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Designation *</label>
        <input type="text" name="designation" class="form-control" value="{{ emp.get('designation', '') }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Joining Date *</label>
        <input type="date" name="joining_date" class="form-control" value="{{ emp.get('joining_date', '') }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Salary *</label>
        <input type="number" step="0.01" min="0" name="salary" class="form-control" value="{{ emp.get('salary', '') }}" required>
      </div>
    </div>
    <div class="mt-4">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> {{ 'Update' if mode == 'edit' else 'Save' }} Employee</button>
      <a href="{{ url_for('main.employees') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
